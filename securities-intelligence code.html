<style>
/* Single-theme by choice: institutional dark (navy / charcoal). Layout: fixed header, left module rail, scrolling main, right-side record drawer. */
:root {
  --bg: #0b1220;          /* deep navy */
  --panel: #111a2b;       /* card */
  --panel2: #16213a;      /* raised / table head */
  --line: #24304a;        /* hairlines */
  --ink: #e6ebf5;         /* primary text */
  --ink2: #9aa7bf;        /* secondary text */
  --blue: #5b9bff;        /* accent */
  --teal: #2fc6b5;        /* positive / supported */
  --amber: #f0b44c;       /* caution / contested */
  --red: #f0626b;         /* critical */
  --violet: #a99bff;      /* inference */
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: flex; flex-direction: column; }
a { color: var(--blue); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: 22px; } h2 { font-size: 15px; } h3.sub { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin: 14px 0 6px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--ink2); } .small { font-size: 11.5px; } .mono { font-family: var(--mono); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pos { color: var(--teal); } .neg { color: var(--red); }
.empty { color: #5e6b84; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 18px; background: #0a101c; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; gap: 10px; align-items: center; }
.logo { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; font: 700 14px var(--display); background: linear-gradient(135deg, #1b3b74, #123a49); border: 1px solid #2c4c82; color: #cfe0ff; }
.bname { font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.bsub { font-size: 11px; color: var(--ink2); }
.topctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg-toggle button { background: transparent; border: 0; padding: 6px 10px; cursor: pointer; color: var(--ink2); }
.seg-toggle button.on { background: var(--panel2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--blue); }
.scope { display: flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 11.5px; }
.scope select { max-width: 230px; }
.persist { font-size: 11px; padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink2); }
.persist.db { border-color: #1f5e57; color: var(--teal); } .persist.local, .persist.memory, .persist.starting { border-color: #6b5426; color: var(--amber); }

/* shell */
.shell { flex: 1; display: flex; min-height: 0; }
.nav { width: 214px; flex: none; border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; background: #0c1424; }
.navlink { display: flex; gap: 9px; align-items: center; padding: 7px 9px; border-radius: 6px; color: var(--ink2); text-decoration: none; margin-bottom: 2px; }
.navlink:hover { background: var(--panel); color: var(--ink); }
.navlink.on { background: var(--panel2); color: var(--ink); box-shadow: inset 2px 0 0 var(--blue); }
.navkey { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; font: 600 11px var(--mono); background: #18233b; color: #9fb6e0; flex: none; }
.main { flex: 1; overflow-y: auto; padding: 16px 22px 60px; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 6px 0 14px; flex-wrap: wrap; }
.lede { color: var(--ink2); margin: 4px 0 0; max-width: 80ch; }
.pact, .toolbar, .formbar, .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.toolbar { margin-bottom: 10px; }
.formbar { margin-top: 10px; align-items: center; }
.gap { gap: 14px; }

/* banners */
.banner { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid; font-size: 12.5px; }
.banner.demo { border-color: #6b5426; background: #2a2212; color: #f4d79d; }
.banner.pend { border-color: #2a3b5e; background: #121c31; color: #b9c8e6; }
.banner.ai { border-color: #6b2a31; background: #2a1418; color: #ffc6cb; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; cursor: pointer; }

/* cards / grid */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; min-width: 0; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.cbody { padding: 12px 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid2 > .card, .grid2 > div > .card { margin-bottom: 14px; }
.grid2.tight { gap: 10px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .nav { display: none; } .shell { display: block; } .main { padding: 12px 16px 60px; } }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpis.four { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.kpi { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid #33415f; border-radius: 6px; padding: 9px 11px; min-width: 0; }
.kpi.ok { border-left-color: var(--teal); } .kpi.warn { border-left-color: var(--amber); } .kpi.bad { border-left-color: var(--red); }
.klabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); }
.kval { font: 600 22px var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.kval small { font-size: 13px; color: var(--ink2); }
.ksub { font-size: 11.5px; color: var(--ink2); margin-top: 3px; }

/* pills / chips */
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid; white-space: nowrap; line-height: 16px; }
.pill.ok { color: var(--teal); border-color: #1f5e57; background: #0f2a2a; }
.pill.ok2 { color: #9fd9f0; border-color: #24506b; background: #0f2233; }
.pill.warn { color: var(--amber); border-color: #6b5426; background: #261e0f; }
.pill.bad { color: var(--red); border-color: #6b2a31; background: #2a1418; }
.pill.bad2 { color: #ff9a8a; border-color: #6b3a2a; background: #2a1913; }
.pill.mute { color: var(--ink2); border-color: #2b3650; background: #141d30; }
.chip { display: inline-block; max-width: 100%; background: #16213a; border: 1px solid #2a3a5c; border-radius: 4px; padding: 0 6px; font-size: 11.5px; color: #c7d6f5; cursor: pointer; margin: 1px 0; text-align: left; }
.chip:hover { border-color: var(--blue); } .chip-bad { border-color: #6b2a31; color: #ffb3b9; }
.tip { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #3a4a6e; color: var(--ink2); font: italic 600 9.5px var(--body); margin-left: 5px; cursor: help; vertical-align: 1px; }
.fs { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px dashed; }
.fs-missing { color: var(--amber); border-color: #6b5426; } .fs-unavailable { color: #c9a0ff; border-color: #4d3a75; } .fs-disputed { color: var(--red); border-color: #6b2a31; } .fs-not_applicable { color: var(--ink2); border-color: #3a4560; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table.dt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.dt th { position: sticky; top: 0; background: var(--panel2); text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dt td { padding: 6px 8px; border-bottom: 1px solid #1b2640; vertical-align: top; }
.dt tr.clickable { cursor: pointer; } .dt tr.clickable:hover td { background: #142039; }
.dt th.sortable { cursor: pointer; } .dt th.sorted { color: var(--ink); } .arr { opacity: .55; font-size: 10px; }
.dt .xcol { width: 26px; } .xbtn { background: none; border: 1px solid #2a3a5c; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; color: var(--ink2); }
.exp-row > td { background: #0e1626; padding: 10px 12px; }
.tcount { font-size: 11px; color: var(--ink2); margin-bottom: 5px; }
.dt select, .mini select { max-width: 220px; padding: 2px 4px; }
table.mini { width: 100%; border-collapse: collapse; }
.mini th, .mini td { padding: 5px 6px; border-bottom: 1px solid #1b2640; text-align: left; vertical-align: top; }
.mini th { font-size: 10.5px; text-transform: uppercase; color: var(--ink2); letter-spacing: .05em; }
.mini td.bar { width: 40%; }
table.cmp th[scope="row"] { color: var(--ink2); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; position: static; background: transparent; }
.fin td.anom { background: #2a1e10; }
.chg { font-size: 10.5px; } .cellbtn { background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.empty-state { padding: 22px; text-align: center; color: var(--ink2); border: 1px dashed #2b3650; border-radius: 6px; }

/* forms */
input, select, textarea { background: #0c1424; border: 1px solid #2a3756; border-radius: 5px; padding: 5px 7px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
input[type="checkbox"] { accent-color: var(--blue); }
input:focus, select:focus, textarea:focus { border-color: var(--blue); }
.search { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.flt { display: flex; flex-direction: column; gap: 2px; font-size: 10.5px; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; }
.flt.wide select { min-width: 380px; max-width: 100%; }
.flt input { width: 120px; }
.chk { display: inline-flex; gap: 5px; align-items: center; color: var(--ink2); font-size: 12px; }
.ff { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.ff label { font-size: 11.5px; color: var(--ink2); }
.ff input, .ff select, .ff textarea { width: 100%; }
.fsrow { display: grid; grid-template-columns: auto 150px 1fr; gap: 6px; align-items: center; margin-top: 3px; }
.hint { font-size: 10.5px; color: #66748f; }
.req { color: var(--red); }
.errors { color: #ffb3b9; font-size: 12px; margin-top: 6px; }
.btn { background: #17223a; border: 1px solid #2c3b5e; border-radius: 5px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--blue); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: #1d4fa3; border-color: #2c63c4; color: #fff; } .btn.primary:hover { background: #2459b6; }
.btn.danger { border-color: #6b2a31; color: #ffb3b9; } .btn.small { padding: 2px 7px; font-size: 11.5px; }
a.btn { text-decoration: none; display: inline-block; color: var(--ink); }
.weights { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; align-items: end; }
.wt { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink2); gap: 3px; } .wt input { width: 90px; }
.wsum { font-size: 12px; } .warnt { color: var(--amber); }
.assign .arow { display: grid; grid-template-columns: 180px 170px 1fr; gap: 8px; align-items: start; }
@media (max-width: 900px) { .assign .arow { grid-template-columns: 1fr; } }

/* key-value */
dl.kv { display: grid; grid-template-columns: 170px 1fr; gap: 5px 12px; margin: 0; }
dl.kv.two { grid-template-columns: 140px 1fr; }
dl.kv dt { color: var(--ink2); font-size: 11.5px; } dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; }
ul.links, ul.checklist, ul.audit, ul.evlist { list-style: none; padding: 0; margin: 0; }
ul.links li, ul.checklist li, ul.audit li, ul.evlist li { padding: 5px 0; border-bottom: 1px solid #1b2640; display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.count { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; }
.count b { font: 600 18px var(--display); } .count span { font-size: 11px; color: var(--ink2); }
.meter { height: 6px; background: #1b2640; border-radius: 3px; overflow: hidden; } .meter span { display: block; height: 100%; background: var(--teal); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; min-width: 90px; background: #1b2640; }
.seg.ok { background: var(--teal); } .seg.ok2 { background: var(--violet); } .seg.warn { background: var(--amber); } .seg.bad { background: var(--red); } .seg.mute { background: #3a4560; }
.scorecell { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.subtabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; color: var(--ink2); cursor: pointer; }
.subtabs button.on { color: var(--ink); border-bottom-color: var(--blue); }
.stsel.ok { color: var(--teal); } .stsel.ok2 { color: var(--violet); } .stsel.warn { color: var(--amber); } .stsel.bad { color: var(--red); }
.eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); }

/* statements & claims */
.stmts { display: flex; flex-direction: column; gap: 10px; }
.stmt { border: 1px solid var(--line); border-left: 3px solid #33415f; border-radius: 6px; padding: 9px 12px; background: #0f182a; }
.stmt.lead { border-left-color: var(--amber); }
.stmt blockquote { margin: 6px 0; font-size: 13.5px; max-width: 95ch; }
.stmt del { color: var(--red); text-decoration: line-through; } .stmt ins { color: var(--teal); text-decoration: none; background: #0f2a2a; }
.leadbox { font-size: 12px; margin: 4px 0 6px; }
.claim { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: #0f182a; }
.claim.claim { border-left: 3px solid #b0564a; } .claim.defense { border-left: 3px solid #4a8eb0; } .claim.enforcement_theory { border-left: 3px solid #b08a3a; }
.claim-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 16px; margin: 8px 0; }
.claim-g p { margin: 2px 0 0; }
.limits { border: 1px solid #6b5426; background: #1d1810; border-radius: 6px; padding: 8px 10px; font-size: 12px; margin: 10px 0; }
ol.prio { list-style: none; padding: 0; margin: 0; } ol.prio li { display: flex; gap: 7px; align-items: center; padding: 5px 0; border-bottom: 1px solid #1b2640; flex-wrap: wrap; }
.rank { font: 600 14px var(--display); width: 22px; color: var(--ink2); } .pbtns { margin-left: auto; display: flex; gap: 4px; }
.evpick { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
details summary { cursor: pointer; color: var(--ink2); margin: 8px 0; }
.importprev { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin-top: 10px; background: #0e1626; }
.errorbox { border: 1px solid #6b2a31; background: #2a1418; padding: 16px; border-radius: 8px; }

/* charts */
.chart { margin: 8px 0 0; } .chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: #1e2a44; stroke-width: 1; }
.chart .axis { fill: var(--ink2); font: 10.5px var(--body); } .chart .axis.lane { font-size: 11px; }
.chart .line { fill: none; stroke-width: 2; } .chart .line.s0 { stroke: var(--blue); } .chart .line.s1 { stroke: #8b96ad; stroke-dasharray: 4 3; }
.chart .area.s0 { fill: var(--blue); opacity: .1; }
.chart .end.s0, .chart .dot.s0 { fill: var(--blue); } .chart .end.s1, .chart .dot.s1 { fill: #8b96ad; }
.chart .marker { stroke: #5e6b84; stroke-width: 1; stroke-dasharray: 2 3; } .chart .marker.bad { stroke: var(--red); } .chart .marker.warn { stroke: var(--amber); }
.chart .mk-dot { fill: #5e6b84; } .chart .mk-dot.bad { fill: var(--red); } .chart .mk-dot.warn { fill: var(--amber); }
.tl-item circle { fill: var(--blue); stroke: var(--bg); stroke-width: 2; cursor: pointer; } .tl-item.warn circle { fill: var(--amber); } .tl-item.bad circle { fill: var(--red); }
.tl-item:hover circle, .tl-item:focus circle { r: 8; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink2); margin-top: 4px; flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 3px; margin-right: 5px; vertical-align: middle; } .sw.s0 { background: var(--blue); } .sw.s1 { background: #8b96ad; } .sw.mk { background: var(--red); }

/* matrix */
.matrix { display: grid; grid-template-columns: 110px repeat(5, minmax(0, 1fr)); gap: 3px; font-size: 11.5px; }
.mx-corner, .mx-col, .mx-row { color: var(--ink2); padding: 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; }
.mx-col { text-align: center; } .mx-row { display: flex; align-items: center; }
.mx-cell { min-height: 46px; border-radius: 4px; background: #121b2e; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
.mx-cell.warm { background: #23201a; } .mx-cell.hot { background: #331a1d; } .mx-cell.nil { background: #0f1727; }

/* drawer & modal */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: #0d1526; border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgba(0,0,0,.45); display: flex; flex-direction: column; z-index: 20; }
.dhead { display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.dhead h2 { font-size: 16px; margin-top: 3px; } .dact { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.dbody { overflow-y: auto; padding: 14px 16px 40px; }
.pad { padding: 16px; }
.overlay { position: fixed; inset: 0; background: rgba(4,8,16,.66); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; }
.modal h2 { margin-bottom: 10px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px); background: #17223a; border: 1px solid #2c3b5e; padding: 8px 14px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; }
.toast.show { opacity: 1; transform: translateX(-50%); } .toast.ok { border-color: #1f5e57; } .toast.warn { border-color: #6b5426; } .toast.bad { border-color: #6b2a31; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.elgrid select { max-width: none; min-width: 262px; }

.cnote{margin-top:2px}.cnote summary{cursor:pointer;list-style:revert}.cnote div{max-width:520px;padding:4px 0;line-height:1.35}

</style>
</head>

/* Supplemental legal-authority library (84 records).

","short_name":"Landreth","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Instruments called 'stock' that bear stock's usual characteristics are securities; no 'sale of business' exception.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["SECURITY"],"source_url":null},{"authority_id":"AUTH-RALSTON","citation":"SEC v. Ralston Purina Co., 346 U.S. 119 (1953)","short_name":"Ralston Purina","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"The private-offering exemption turns on whether offerees need the protection of registration (can fend for themselves / access to registration-type information); the issuer bears the burden of proving an exemption.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S5"],"source_url":null},{"authority_id":"AUTH-PINTER","citation":"Pinter v. Dahl, 486 U.S. 622 (1988)","short_name":"Pinter","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"A statutory 'seller' under \u00a7 12 is one who passes title or who successfully solicits the purchase motivated at least in part by its own or the owner's financial interest.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S12A1","S12A2"],"source_url":null},{"authority_id":"AUTH-GUSTAFSON","citation":"Gustafson v. Alloyd Co., 513 U.S. 561 (1995)","short_name":"Gustafson","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"'Prospectus' in \u00a7 12(a)(2) refers to documents in a public offering; \u00a7 12(a)(2) does not reach private contracts of sale.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S12A2"],"source_url":null},{"authority_id":"AUTH-HERMAN","citation":"Herman & MacLean v. Huddleston, 459 U.S. 375 (1983)","short_name":"Herman & MacLean","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"The availability of a \u00a7 11 remedy does not preclude a cumulative Rule 10b-5 action.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S11","10B5"],"source_url":null},{"authority_id":"AUTH-OMNICARE","citation":"Omnicare, Inc. v. Laborers Dist. Council Constr. Indus. Pension Fund, 575 U.S. 175 (2015)","short_name":"Omnicare","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"A statement of opinion is an untrue statement of fact under \u00a7 11 only if not sincerely held or containing an embedded false fact; it may be misleading by omission if it omits material facts about the issuer's inquiry or knowledge that conflict with what a reasonable investor would take from the statement in context.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S11","10B5","OPINION"],"source_url":null},{"authority_id":"AUTH-SLACK","citation":"Slack Technologies, LLC v. Pirani, 598 U.S. 759 (2023)","short_name":"Slack","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"\u00a7 11 requires a plaintiff to plead and prove that the securities purchased were registered under (traceable to) the allegedly defective registration statement.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S11"],"source_url":null},{"authority_id":"AUTH-CALPERS","citation":"California Public Employees' Retirement System v. ANZ Securities, Inc., 582 U.S. 497 (2017)","short_name":"CalPERS v. ANZ","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"\u00a7 13's three-year repose period is not subject to American Pipe tolling.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["SOL","S11"],"source_url":null},{"authority_id":"AUTH-CYAN","citation":"Cyan, Inc. v. Beaver County Employees Retirement Fund, 583 U.S. 416 (2018)","short_name":"Cyan","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"State courts retain concurrent jurisdiction over 1933 Act class actions; SLUSA did not authorize removal of such suits.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S11","PROC"],"source_url":null},{"authority_id":"AUTH-TSC","citation":"TSC Industries, Inc. v. Northway, Inc., 426 U.S. 438 (1976)","short_name":"TSC","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"An omitted fact is material if there is a substantial likelihood a reasonable shareholder would consider it important - i.e., it would have significantly altered the total mix of information made available.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["MAT","S14A"],"source_url":null},{"authority_id":"AUTH-BASIC","citation":"Basic Inc. v. Levinson, 485 U.S. 224 (1988)","short_name":"Basic","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Adopts TSC materiality for 10b-5; contingent events assessed by probability and magnitude; rebuttable fraud-on-the-market presumption of reliance; silence absent a duty to disclose is not misleading.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["MAT","REL","10B5"],"source_url":null},{"authority_id":"AUTH-MATRIXX","citation":"Matrixx Initiatives, Inc. v. Siracusano, 563 U.S. 27 (2011)","short_name":"Matrixx","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"No bright-line rule that adverse-event reports must be statistically significant to be material; materiality is contextual.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["MAT"],"source_url":null},{"authority_id":"AUTH-HOCHFELDER","citation":"Ernst & Ernst v. Hochfelder, 425 U.S. 185 (1976)","short_name":"Hochfelder","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Private 10b-5 liability requires scienter - a mental state embracing intent to deceive, manipulate or defraud; negligence is insufficient (recklessness question reserved).","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["SCI","10B5"],"source_url":null},{"authority_id":"AUTH-AARON","citation":"Aaron v. SEC, 446 U.S. 680 (1980)","short_name":"Aaron","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"SEC must prove scienter under 10(b)/10b-5 and \u00a7 17(a)(1), but not under \u00a7 17(a)(2) or (a)(3).","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["SCI","S17A"],"source_url":null},{"authority_id":"AUTH-TELLABS","citation":"Tellabs, Inc. v. Makor Issues & Rights, Ltd., 551 U.S. 308 (2007)","short_name":"Tellabs","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Under the PSLRA, a 'strong inference' of scienter must be more than merely plausible - cogent and at least as compelling as any opposing inference, considering allegations holistically.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["SCI","PLEAD"],"source_url":null},{"authority_id":"AUTH-DURA","citation":"Dura Pharmaceuticals, Inc. v. Broudo, 544 U.S. 336 (2005)","short_name":"Dura","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"An inflated purchase price alone does not establish loss causation or economic loss; plaintiff must allege and prove a causal connection between the misrepresentation and the loss.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["LC"],"source_url":null},{"authority_id":"AUTH-HALLIBURTON2","citation":"Halliburton Co. v. Erica P. John Fund, Inc., 573 U.S. 258 (2014)","short_name":"Halliburton II","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Declines to overrule Basic; defendants may rebut the presumption at class certification with evidence of no price impact.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["REL","CLASS"],"source_url":null},{"authority_id":"AUTH-AMGEN","citation":"Amgen Inc. v. Connecticut Retirement Plans & Trust Funds, 568 U.S. 455 (2013)","short_name":"Amgen","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Plaintiffs need not prove materiality at class certification.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["CLASS","MAT"],"source_url":null},{"authority_id":"AUTH-GOLDMAN","citation":"Goldman Sachs Group, Inc. v. Arkansas Teacher Retirement System, 594 U.S. 113 (2021)","short_name":"Goldman","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Courts may consider the generic nature of statements in assessing price impact at class certification; defendants bear the burden of persuasion on lack of price impact; mismatch between generic front-end statements and specific back-end disclosures weakens inflation-maintenance inference.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["REL","CLASS"],"source_url":null},{"authority_id":"AUTH-AFFUTE","citation":"Affiliated Ute Citizens of Utah v. United States, 406 U.S. 128 (1972)","short_name":"Affiliated Ute","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"In cases primarily involving omissions by one with a duty to disclose, reliance is presumed if the withheld facts are material.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["REL"],"source_url":null},{"authority_id":"AUTH-BLUECHIP","citation":"Blue Chip Stamps v. Manor Drug Stores, 421 U.S. 723 (1975)","short_name":"Blue Chip","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Private 10b-5 plaintiffs must be actual purchasers or sellers.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5","STANDING"],"source_url":null},{"authority_id":"AUTH-SANTAFE","citation":"Santa Fe Industries, Inc. v. Green, 430 U.S. 462 (1977)","short_name":"Santa Fe","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Breach of fiduciary duty without deception or manipulation is not a 10(b) violation.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5"],"source_url":null},{"authority_id":"AUTH-CENTRALBANK","citation":"Central Bank of Denver, N.A. v. First Interstate Bank of Denver, N.A., 511 U.S. 164 (1994)","short_name":"Central Bank","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"No private aiding-and-abetting liability under \u00a7 10(b).","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["S20E","10B5"],"source_url":null},{"authority_id":"AUTH-STONERIDGE","citation":"Stoneridge Investment Partners, LLC v. Scientific-Atlanta, Inc., 552 U.S. 148 (2008)","short_name":"Stoneridge","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Secondary actors' undisclosed deceptive acts are not actionable by private plaintiffs who did not rely on them.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5","REL"],"source_url":null},{"authority_id":"AUTH-JANUS","citation":"Janus Capital Group, Inc. v. First Derivative Traders, 564 U.S. 135 (2011)","short_name":"Janus","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"The 'maker' of a statement under Rule 10b-5(b) is the person or entity with ultimate authority over its content and whether and how to communicate it.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5"],"source_url":null},{"authority_id":"AUTH-LORENZO","citation":"Lorenzo v. SEC, 587 U.S. 71 (2019)","short_name":"Lorenzo","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Disseminating false statements with intent to defraud can violate Rule 10b-5(a) and (c) and \u00a7 17(a)(1) even if the disseminator is not the 'maker'.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5","SCHEME"],"source_url":null},{"authority_id":"AUTH-MACQUARIE","citation":"Macquarie Infrastructure Corp. v. Moab Partners, L.P., 601 U.S. 257 (2024)","short_name":"Macquarie","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Pure omissions (including failure to disclose information required by Item 303) are not actionable under Rule 10b-5(b); 10b-5(b) reaches half-truths that render statements made misleading.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["10B5","DISC"],"source_url":null},{"authority_id":"AUTH-MORRISON","citation":"Morrison v. National Australia Bank Ltd., 561 U.S. 247 (2010)","short_name":"Morrison","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"\u00a7 10(b) reaches only transactions in securities listed on domestic exchanges and domestic transactions in other securities.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["EXTRA","10B5"],"source_url":null}, _basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["IT"],"source_url":null},{"authority_id":"AUTH-OHAGAN","citation":"United States v. O'Hagan, 521 U.S. 642 (1997)","short_name":"O'Hagan","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Upholds the misappropriation theory (deceptive use of confidential information in breach of a duty owed to the source) and Rule 14e-3(a) as applied.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["IT"],"source_url":null},{"authority_id":"AUTH-SALMAN","citation":"Salman v. United States, 580 U.S. 39 (2016)","short_name":"Salman","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"A gift of confidential information to a trading relative or friend satisfies Dirks' personal-benefit requirement.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","course_explanation":null,"current_validity":"verification_pending","validity_basis":null,"verification_method":null,"verified_date":null,"pinpoints":[],"issue_ids":["IT"],"source_url":null},{"authority_id":"AUTH-SIMMONDS","citation":"Credit Suisse Securities (USA) LLC v. Simmonds, 566 U.S. 221 (2012)","short_name":"Simmonds","jurisdiction":"US-SCOTUS","authority_type":"scotus_opinion","binding_force":"binding_nationwide","date_decided_or_effective":null,"rule_or_holding":"Rejects the rule that \u00a7 16(b)'s two-year period is tolled until the insider files a \u00a7 16(a) report; equitable tolling question addressed narrowly.","holding_source":"model_knowledge_unverified","course_relation":"course_not_yet_ingested","co const MIGRATIONS = {
  /* 0.9.0 (prototype export format): companies used "reporting"; no statements / verification_log; assignment fields were plain strings. */
  "0.9.0": function (ws) {
    (ws.companies || []).forEach(c => { if (c.reporting !== undefined && c.reporting_status === undefined) { c.reporting_status = c.reporting; delete c.reporting; } });
    ws.statements = ws.statements || []; ws.verification_log = ws.verification_log || [];
    if (ws.assignment) Object.keys(ws.assignment).forEach(k => { const v = ws.assignment[k]; if (typeof v === "string") ws.assignment[k] = { status: v ? "provided" : "pending", value: v }; });
    ws.schema_version = "1.0.0"; return ws;
  }
};

function migrate(ws) {
  const log = [];
  let guard = 0;
  while (ws.schema_version !== SCHEMA_VERSION && guard++ < 20) {
    const fn = MIGRATIONS[ws.schema_version];
    if (!fn) throw new Error("No migration path from schema version " + ws.schema_version + " to " + SCHEMA_VERSION + ".");
    const from = ws.schema_version; ws = fn(ws); log.push(from + " → " + ws.schema_version);
  }
  /* Fill any structure missing from older or partial files. */
  const base = emptyWorkspace((ws.meta && ws.meta.kind) || "real");
  ws.meta = Object.assign(base.meta, ws.meta || {});
  ws.settings = Object.assign(base.settings, ws.settings || {});
  ws.settings.weights = Object.assign({}, base.settings.weights, ws.settings.weights || {});
  ws.assignment = Object.assign(base.assignment, ws.assignment || {});
  ENTITY_KEYS.forEach(k => { if (!Array.isArray(ws[k])) ws[k] = []; });
  return { ws: ws, log: log };
}

/* Validation of an imported workspace. Returns {errors:[], warnings:[]} */
function validateWorkspace(ws, targetKind) {
  const errors = [], warnings = [];
  if (!ws || typeof ws !== "object") { errors.push("File is not a JSON object."); return { errors, warnings }; }
  if (!ws.schema_version) errors.push("Missing schema_version.");
  const ids = new Set();
  ENTITY_KEYS.forEach(k => {
    if (ws[k] !== undefined && !Array.isArray(ws[k])) errors.push(k + " must be an array.");
    (ws[k] || []).forEach((r, i) => {
      if (!r || typeof r !== "object") { errors.push(k + "[" + i + "] is not an object."); return; }
      if (!r.id) errors.push(k + "[" + i + "] has no id.");
      else if (ids.has(r.id)) errors.push("Duplicate id " + r.id + ".");
      else ids.add(r.id);
      if (r.id) {
        const demoId = String(r.id).startsWith("DEMO-");
        if (targetKind === "real" && demoId) errors.push(r.id + ": demonstration record cannot be imported into the Real workspace.");
        if (targetKind === "demo" && !demoId) warnings.push(r.id + ": record without DEMO- prefix imported into the Demo workspace.");
      }
    });
  });
  ENTITY_KEYS.forEach(k => (ws[k] || []).forEach(r => ENTITIES[k].fields.forEach(f => {
    const [key, , type, o] = f; const v = r[key];
    if ((type === "ref" || type === "refs") && v) {
      (Array.isArray(v) ? v : [v]).forEach(t => { if (t && typeof t === "string" && !ids.has(t)) warnings.push(r.id + "." + key + " points to missing record " + t + "."); });
    }
    if (type === "date" && typeof v === "string" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errors.push(r.id + "." + key + ": date must be YYYY-MM-DD (got " + v + ").");
  })));
  return { errors, warnings };
}

<script>
/* Persistence: artifact database (preferred) → browser storage (fallback) → memory only.
   DB layout per workspace kind (real | demo):
     ws/<kind>/meta/manifest          {schema_version, updated, chunks:{entity:n}, settings, assignment, meta}
     ws/<kind>/ent/<entity>~<n>       {json: "<JSON array slice>"}   (chunked to stay under 256 KiB)  */

const Store = {
  mode: "starting",       // starting | db | local | memory
  db: null,
  downloads: null,
  canWrite: true,
  status: "Connecting to storage…",
  lastSaved: null,
  timers: {},
  pending: {},
  writing: {},
  CHUNK: 150000,

  async init() {
    let db = null, dl = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const results = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("downloads").catch(() => null)]);
        db = results[0]; dl = results[1];
      }
    } catch (e) { db = null; }
    this.downloads = dl || null;
    if (db) { this.db = db; this.mode = "db"; this.status = "Saved to project database"; }
    else if (this.localOk()) { this.mode = "local"; this.status = "Browser storage only — export backups"; }
    else { this.mode = "memory"; this.status = "Not saved — export a backup before leaving"; }
    return this.mode;
  },

  localOk() { try { const k = "__si_t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (e) { return false; } },

  async load(kind) {
    if (this.mode === "db") {
      try {
        const snap = await withTimeout(this.db.doc("ws/" + kind + "/meta/manifest").get(), 10000);
        if (!snap.exists) return null;
        const man = snap.data();
        const ws = { schema_version: man.schema_version, meta: man.meta, settings: man.settings, assignment: man.assignment };
        for (const ent of ENTITY_KEYS) {
          const n = (man.chunks && man.chunks[ent]) || 0; let arr = [];
          for (let i = 0; i < n; i++) {
            const s = await withTimeout(this.db.doc("ws/" + kind + "/ent/" + ent + "~" + i).get(), 10000);
            if (s.exists) arr = arr.concat(JSON.parse(s.data().json || "[]"));
          }
          ws[ent] = arr;
        }
        this._chunks = this._chunks || {}; this._chunks[kind] = Object.assign({}, man.chunks || {});

      } catch (e) {
        this.status = "Database unreachable — using browser copy"; this.mode = this.localOk() ? "local" : "memory";
      }

      try { const raw = localStorage.getItem("si_ws_" + kind); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    }

  },

  /* Schedule a save of the given entities (or "all"). Coalesces bursts. */
  schedule(kind, ws, entities) {
    this.pending[kind] = this.pending[kind] || new Set();
    (entities === "all" ? ENTITY_KEYS.concat(["_meta"]) : entities.concat(["_meta"])).forEach(e => this.pending[kind].add(e));
    clearTimeout(this.timers[kind]);
    this.status = this.mode === "db" ? "Saving…" : this.status;
    this.timers[kind] = setTimeout(() => this.flush(kind), 700);
  },

  async flush(kind) {
    const ws = App.kinds[kind];   /* always write the current object for this workspace */
    if (!ws) return;

/* ---------- small helpers ---------- */
const esc = s => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isStat = v => !!v && typeof v === "object" && !Array.isArray(v) && Object.prototype.hasOwnProperty.call(v, "$s");
const raw = v => isStat(v) ? null : v;
const has = v => !isStat(v) && v !== "" && v !== null && v !== undefined && !(Array.isArray(v) && v.length === 0);
const pct = (a, b) => b ? Math.round(100 * a / b) : null;
const fmtPct = p => p === null || p === undefined || isNaN(p) ? "Unknown" : p + "%";
const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const uniq = a => Array.from(new Set(a));
const num = v => { const r = raw(v); if (r === "" || r === null || r === undefined) return null; const n = Number(r); return isNaN(n) ? null : n; };

function disp(v, opts) {
  if (isStat(v)) return `<span class="fs fs-${esc(v.$s)}" title="${esc(v.note || FIELD_STATUS_LABEL[v.$s])}">${esc(FIELD_STATUS_LABEL[v.$s] || v.$s)}${v.note ? " · " + esc(trunc(v.note, 40)) : ""}</span>`;
  if (v === "" || v === null || v === undefined || (Array.isArray(v) && !v.length)) return `<span class="empty" title="Empty — not yet entered">—</span>`;
  if (Array.isArray(v)) return v.map(esc).join(", ");
  if (typeof v === "boolean") return v ? "Yes" : "No";
  if (opts && opts.url && /^https?:\/\//.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(trunc(v, 60))}</a>`;
  return esc(v);
}

function byId(entity, id) { return (W()[entity] || []).find(r => r.id === id) || null; }
function findAny(id) { for (const k of ENTITY_KEYS) { const r = (W()[k] || []).find(x => x.id === id); if (r) return { entity: k, rec: r }; } return null; }
function titleOf(entity, rec) { if (!rec) return ""; const t = rec[ENTITIES[entity].title]; return isStat(t) ? rec.id : String(t || rec.id); }
function refLabel(entity, id) { const r = byId(entity, id); return r ? trunc(titleOf(entity, r), 48) : id + " (missing)"; }
function chip(entity, id) { if (!id) return ""; const r = byId(entity, id); return `<button class="chip ${r ? "" : "chip-bad"}" data-act="open" data-e="${entity}" data-id="${esc(id)}" title="${esc(id)}">${esc(r ? trunc(titleOf(entity, r), 34) : id + " (missing)")}</button>`; }
function chips(entity, ids) { return (ids || []).length ? (ids || []).map(i => chip(entity, i)).join(" ") : `<span class="empty">—</span>`; }
function pill(text, cls, tip) { return `<span class="pill ${cls || ""}"${tip ? ` title="${esc(tip)}"` : ""}>${esc(text)}</span>`; }
function tip(text) { return `<span class="tip" tabindex="0" title="${esc(text)}" aria-label="${esc(text)}">i</span>`; }

function scopeCompany() { return W().settings.selected_company || ""; }
function inScope(r) { const c = scopeCompany(); return !c || !r.company_id || r.company_id === c; }
function scoped(entity) { return (W()[entity] || []).filter(r => { const c = scopeCompany(); return !c || r.company_id === c; }); }
function issuesInScope() { return scoped("issues"); }
function elementsOf(issueId) { return W().elements.filter(e => e.issue_id === issueId); }

function newId(entity) {
  const ws = W(); const pre = (App.kind === "demo" ? "DEMO-" : "") + ENTITIES[entity].prefix + "-";
  const ids = new Set(ENTITY_KEYS.flatMap(k => ws[k].map(r => r.id)));
  let n = ws[entity].length + 1; let id;
  do { id = pre + String(n).padStart(4, "0"); n++; } while (ids.has(id));

}

/* ---------- mutation & logging ---------- */
function mutate(entities, fn, opts) {
  const ws = W(); fn(ws); ws.meta.updated = nowIso();
  if (App.ready) Store.schedule(App.kind, ws, entities);
  if (!opts || !opts.noRender) render();
}
function logVerification(ws, entity, id, field, from, to, note) {
  if (from === to) return;
  const pre = (App.kind === "demo" ? "DEMO-" : "") + "VLOG-";
  ws.verification_log.unshift({ id: pre + Date.now().toString(36) + Math.floor(Math.random() * 1000), at: nowIso(), record_type: entity, record_id: id, action: field, from: String(from || ""), to: String(to || ""), note: note || "" });
}
const LOGGED_FIELDS = { evidence: ["verification_status", "evidentiary_strength"], elements: ["status"], authorities: ["current_validity", "holding_source"], documents: ["review_status"] };

function setField(entity, id, key, value) {
  mutate([entity, "verification_log"], ws => {
    const r = ws[entity].find(x => x.id === id); if (!r) return;
    if ((LOGGED_FIELDS[entity] || []).includes(key)) logVerification(ws, entity, id, key, r[key], value);
    r[key] = value;
  });
}

function toast(msg, kind) { App.ui.toast = { msg, kind: kind || "info", t: Date.now() }; renderToast(); clearTimeout(App._tt); App._tt = setTimeout(() => { App.ui.toast = null; renderToast(); }, 4200); }
function renderToast() { const el = document.getElementById("toast"); if (!el) return; const t = App.ui.toast; el.className = "toast" + (t ? " show " + t.kind : ""); el.textContent = t ? t.msg : ""; }

/* ---------- generic sortable table ---------- */
function sortKey(v) { if (isStat(v)) return "￿" + v.$s; if (Array.isArray(v)) return v.length; if (v === "" || v === null || v === undefined) return "￿"; return typeof v === "number" ? v : String(v).toLowerCase(); }
function cmp(a, b) { if (typeof a === "number" && typeof b === "number") return a - b; return String(a).localeCompare(String(b), undefined, { numeric: true }); }

function dataTable(tid, rows, cols, o) {
  o = o || {};
  const st = App.ui.sort[tid];
  if (st) { const c = cols.find(c => c.k === st.k); if (c) { const f = c.s || (r => sortKey(r[c.k])); rows = rows.slice().sort((a, b) => cmp(f(a), f(b)) * st.d); } }
  const count = `<div class="tcount">${rows.length} record${rows.length === 1 ? "" : "s"}${o.countNote ? " · " + o.countNote : ""}</div>`;
  if (!rows.length) return count + `<div class="empty-state">${o.empty || "No records match."}</div>`;
  const head = (o.expand ? `<th class="xcol" aria-label="Expand"></th>` : "") + cols.map(c => {
    const on = st && st.k === c.k; const arrow = on ? (st.d === 1 ? "▲" : "▼") : "↕";
    return c.nosort ? `<th>${esc(c.label)}${c.tip ? tip(c.tip) : ""}</th>` :
      `<th class="sortable${on ? " sorted" : ""}" data-act="sort" data-t="${tid}" data-k="${c.k}" tabindex="0" title="Sort by ${esc(c.label)}">${esc(c.label)}${c.tip ? tip(c.tip) : ""} <span class="arr">${arrow}</span></th>`;
  }).join("");
  const body = rows.map(r => {
    const ex = o.expand && App.ui.expanded[tid + ":" + r.id];
    const tr = `<tr class="${o.rowCls ? o.rowCls(r) : ""}${o.entity ? " clickable" : ""}" ${o.entity ? `data-act="open" data-e="${o.entity}" data-id="${esc(r.id)}"` : ""}>` +
      (o.expand ? `<td class="xcol"><button class="xbtn" data-act="expand" data-t="${tid}" data-id="${esc(r.id)}" aria-expanded="${ex ? "true" : "false"}" title="${ex ? "Collapse" : "Expand"}">${ex ? "▾" : "▸"}</button></td>` : "") +
      cols.map(c => `<td class="${c.cls || ""}">${c.r ? c.r(r) : disp(r[c.k])}</td>`).join("") + `</tr>`;
    return tr + (ex ? `<tr class="exp-row"><td colspan="${cols.length + 1}">${o.expand(r)}</td></tr>` : "");
  }).join("");
  return count + `<div class="tablewrap"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- generic drawer (detail + edit) ---------- */
function openDrawer(entity, id, mode) { App.ui.drawer = { entity, id, mode: mode || "view" }; render(); }
function backlinks(id) {

  })));

function drawerHtml() {
  const d = App.ui.drawer; if (!d) return "";
  const def = ENTITIES[d.entity];
  const rec = d.mode === "new" ? d.draft : byId(d.entity, d.id);

  const demo = String(rec.id || "").startsWith("DEMO-");
  let body;
  if (d.mode === "view") {
    body = `<dl class="kv">` + def.fields.map(f => {
      const [k, label, type, o] = f; let v = rec[k];

  }

    <div class="dbody">${body}</div></aside>`;
}

function formField(f, v, entity) {
  const [k, label, type, o] = f; const id = "f_" + k; const st = isStat(v) ? v.$s : "value"; const note = isStat(v) ? (v.note || "") : "";
  const disabled = st !== "value" ? " data-statused=\"1\"" : "";
  let input;
  const val = isStat(v) ? "" : (v === undefined || v === null ? "" : v);
  if (type === "textarea") input = `<textarea id="${id}" name="${k}" rows="3"${disabled}>${esc(val)}</textarea>`;
  else if (type === "select") { const opts = ENUM[o.e] || []; input = selectHtml(id, [""].concat(opts), val, `name="${k}"`, [""].concat(opts.map(x => (o.e === "_templates" ? x + " — " + TEMPLATES[x].name : String(x).replace(/_/g, " "))))); }
  else if (type === "bool") input = `<select id="${id}" name="${k}"><option value="false"${val !== true ? " selected" : ""}>No</option><option value="true"${val === true ? " selected" : ""}>Yes</option></select>`;
  else if (type === "ref") { const rows = W()[o.ref]; input = selectHtml(id, [""].concat(rows.map(r => r.id)), val, `name="${k}"`, ["— none —"].concat(rows.map(r => r.id + " · " + trunc(titleOf(o.ref, r), 50)))); }
  else if (type === "refs") { const rows = W()[o.ref]; const sel = Array.isArray(val) ? val : []; input = `<select id="${id}" name="${k}" multiple size="${Math.min(8, Math.max(3, rows.length))}">${rows.map(r => `<option value="${esc(r.id)}"${sel.includes(r.id) ? " selected" : ""}>${esc(r.id + " · " + trunc(titleOf(o.ref, r), 60))}</option>`).join("")}</select><div class="hint">Ctrl/Cmd-click to select several.</div>`; }
  else if (type === "number") input = `<input id="${id}" name="${k}" type="number" step="any" value="${esc(val)}">`;
  else if (type === "date") input = `<input id="${id}" name="${k}" type="date" value="${esc(val)}" pattern="\\d{4}-\\d{2}-\\d{2}">`;
  else input = `<input id="${id}" name="${k}" type="${type === "url" ? "url" : "text"}" value="${esc(val)}">`;
  const stSel = o.status ? `<div class="fsrow"><label for="fs_${k}" class="muted small">Field state</label>${selectHtml("fs_" + k, ENUM.fieldStatus, st, `name="fs_${k}"`, ENUM.fieldStatus.map(s => FIELD_STATUS_LABEL[s]))}<input id="fn_${k}" name="fn_${k}" placeholder="Note (why missing, disputed…)" value="${esc(note)}"></div>` : "";
  return `<div class="ff"><label for="${id}">${esc(label)}${o.req ? ' <span class="req" title="Required">*</span>' : ""}</label>${input}${stSel}</div>`;
}

function readForm(entity) {
  const def = ENTITIES[entity]; const out = {}; const errors = [];
  def.fields.forEach(f => {
    const [k, label, type, o] = f; const el = document.getElementById("f_" + k); if (!el) return;
    let v;
    if (type === "refs") v = Array.from(el.selectedOptions).map(x => x.value);
    else if (type === "bool") v = el.value === "true";
    else if (type === "number") v = el.value === "" ? "" : Number(el.value);
    else v = el.value.trim();
    if (type === "date" && v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errors.push(label + ": use YYYY-MM-DD.");
    const fs = document.getElementById("fs_" + k);
    if (fs && fs.value !== "value") v = { $s: fs.value, note: (document.getElementById("fn_" + k).value || "").trim() };
    if (o.req && !has(v) && !isStat(v)) errors.push(label + " is required.");
    out[k] = v;
  });
  return { rec: out, errors };
}

function saveDrawer() {
  const d = App.ui.drawer; if (!d) return;
  const { rec, errors } = readForm(d.entity);
  if (errors.length) { const el = document.getElementById("form-errors"); if (el) el.innerHTML = errors.map(esc).join("<br>"); return; }
  mutate([d.entity, "verification_log"], ws => {
    if (d.mode === "new") { const id = d.draft.id; ws[d.entity].push(Object.assign({ id }, rec)); App.ui.drawer = { entity: d.entity, id, mode: "view" }; afterCreate(ws, d.entity, Object.assign({ id }, rec)); }
    else { const r = ws[d.entity].find(x => x.id === d.id); (LOGGED_FIELDS[d.entity] || []).forEach(k => { if (k in rec) logVerification(ws, d.entity, d.id, k, r[k], rec[k]); }); Object.assign(r, rec); App.ui.drawer.mode = "view"; }

function afterCreate(ws, entity, rec) {
  if (entity === "issues" && rec.template && TEMPLATES[rec.template]) {

  }
}
function uniqueId(ws, entity) { const pre = (App.kind === "demo" ? "DEMO-" : "") + ENTITIES[entity].prefix + "-"; const ids = new Set(ws[entity].map(r => r.id)); let n = ws[entity].length + 1, id; do { id = pre + String(n++).padStart(4, "0"); } while (ids.has(id)); return id; }

function newRecord(entity, preset) {
  const id = newId(entity);
  const draft = Object.assign({ id }, preset || {});
  if (!("company_id" in draft) && ENTITIES[entity].fields.some(f => f[0] === "company_id") && scopeCompany()) draft.company_id = scopeCompany();

function deleteRecord(entity, id) {
  mutate(ENTITY_KEYS, ws => {
    ws[entity] = ws[entity].filter(r => r.id !== id);
    if (entity === "issues") ws.elements = ws.elements.filter(e => e.issue_id !== id);
    ENTITY_KEYS.forEach(k => ws[k].forEach(r => ENTITIES[k].fields.forEach(f => {
      if (f[2] === "refs" && Array.isArray(r[f[0]])) r[f[0]] = r[f[0]].filter(x => x !== id);
      if (f[2] === "ref" && r[f[0]] === id) r[f[0]] = "";
    })));
    if (ws.settings.selected_company === id) ws.settings.selected_company = "";
    App.ui.drawer = null;
  });
  toast("Deleted " + id + " and removed links to it.", "ok");
}

/* ---------- scoring dimensions ---------- */
function selectionScore(co) {
  const w = W().settings.weights; const total = CRITERIA.reduce((s, c) => s + (Number(w[c[0]]) || 0), 0);
  let known = 0, acc = 0; const details = [];
  CRITERIA.forEach(c => {
    const key = c[0]; const wt = Number(w[key]) || 0; const s = (co.scores || {})[key] || {};
    const score = s.score === null || s.score === undefined || s.score === "" ? null : Number(s.score);
    let state = "unknown";
    if (score !== null && (s.evidence_ids || []).length) { state = "counted"; known += wt; acc += wt * score / 5; }
    else if (score !== null) state = "unsupported";
    details.push({ key, label: c[1], weight: wt, score, state, evidence: s.evidence_ids || [], note: s.note || "" });
  });
  const coverage = total ? known / total : 0;
  return { score: known ? Math.round(100 * acc / known) : null, coverage: Math.round(coverage * 100), details, sufficient: coverage >= 0.5 };
}

const EV_LEVELS = ["Unknown", "Gaps", "Contested", "Partial", "Supported"];
function issueEvidenceClass(issue) {
  const els = elementsOf(issue.id); const ess = els.filter(e => e.essential);
  const counts = {}; ENUM.elementStatus.forEach(s => counts[s] = 0); els.forEach(e => counts[e.status || "Unassessed"]++);
  if (!els.length) return { label: "No elements", level: 0, cls: "mute", counts };
  if (els.every(e => (e.status || "Unassessed") === "Unassessed")) return { label: "Unknown", level: 0, cls: "mute", counts };
  const gaps = ess.filter(e => ["Unsupported", "Not established from available sources"].includes(e.status)).length;
  if (gaps) return { label: `Gaps (${gaps} essential)`, level: 1, cls: "bad", counts };

  return `<figure class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label || "Timeline")}">${g}</svg><figcaption class="muted small">Select a point to open its record.</figcaption></figure>`;
}

function statusBar(counts) {
  const order = ["Supported by verified evidence", "Supported by reasonable inference", "Contested", "Unsupported", "Not established from available sources", "Not applicable", "Unassessed"];

  return `<div class="sbar" role="img" aria-label="Element status distribution">${order.filter(k => counts[k]).map(k => `<span class="seg ${STATUS_CLASS[k]}" style="flex:${counts[k]}" title="${esc(k)}: ${counts[k]}"></span>`).join("")}</div>`;

function riskMatrix(issues) {
  const sev = ["Severe", "High", "Moderate", "Low", "Unknown"];
  const cells = {}; issues.forEach(i => { const k = (i.severity || "Unknown") + "|" + issueEvidenceClass(i).level; (cells[k] = cells[k] || []).push(i); });
  let html = `<div class="matrix" role="table" aria-label="Risk matrix"><div class="mx-corner">Severity ↓ / Evidence →</div>${EV_LEVELS.map(l => `<div class="mx-col">${esc(l)}</div>`).join("")}`;
  sev.forEach(s => { html += `<div class="mx-row">${esc(s)}</div>` + EV_LEVELS.map((_, li) => { const list = cells[s + "|" + li] || []; const heat = (["Severe", "High"].includes(s) && li >= 3) ? "hot" : (["Severe", "High"].includes(s) || li >= 3) ? "warm" : "";
    return `<div class="mx-cell ${list.length ? heat : "nil"}">${list.map(i => chip("issues", i.id)).join("")}</div>`; }).join(""); });
  return html + `</div><p class="muted small">Rows: B. legal risk severity (your classification). Columns: C. evidence strength derived from essential elements. A cell is a research priority, not a liability finding.</p>`;
}

function diffWords(a, b) {
  const A = String(a).split(/\s+/), B = String(b).split(/\s+/); const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = [];
  while (i < n && j < m) { if (A[i] === B[j]) { out.push(esc(A[i])); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) { out.push(`<del>${esc(A[i++])}</del>`); } else { out.push(`<ins>${esc(B[j++])}</ins>`); } }
  while (i < n) out.push(`<del>${esc(A[i++])}</del>`); while (j < m) out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(" ");
}

/* ================= E. Financial Forensics ================= */
function viewForensics() {
  const c = scopeCompany(); const ws = W();
  if (!c) return pageHead("Financial Forensics", "Metric trends, ratios, anomalies, insider transactions and market-adjusted returns.") + card("", needCompany());
  const fin = ws.fin_obs.filter(f => f.company_id === c); const metrics = uniq(fin.map(f => f.metric)).sort();
  const periods = uniq(fin.map(f => f.period_end)).sort();
  const th = Number(ws.settings.anomaly_threshold) || 20;
  const valOf = (m, p) => { const r = fin.find(f => f.metric === m && f.period_end === p); return r ? num(r.value) : null; };
  const recOf = (m, p) => fin.find(f => f.metric === m && f.period_end === p);
  const anomalies = [];
  const pivot = metrics.length ? `<div class="tablewrap"><table class="dt fin"><thead><tr><th>Metric</th>${periods.map(p => `<th class="num">${esc((fin.find(f => f.period_end === p) || {}).period_label || p)}</th>`).join("")}</tr></thead><tbody>${metrics.map(m => `<tr><th scope="row">${esc(m)}</th>${periods.map((p, i) => {
    const r = recOf(m, p); if (!r) return `<td class="num"><span class="empty">—</span></td>`; const v = num(r.value);
    const prev = i ? valOf(m, periods[i - 1]) : null; const ch = v !== null && prev ? (v - prev) / Math.abs(prev) * 100 : null; const anom = ch !== null && Math.abs(ch) >= th;
    if (anom) anomalies.push({ m, p, ch, r });
    const unsourced = r.data_status !== "demo_fictional" && !has(r.evidence_id);
    return `<td class="num ${anom ? "anom" : ""}"><button class="cellbtn" data-act="open" data-e="fin_obs" data-id="${esc(r.id)}" title="${esc(r.data_status)}${unsourced ? " — no source evidence" : ""}">${v === null ? disp(r.value) : v.toLocaleString()}</button>${ch !== null ? `<div class="chg ${ch < 0 ? "neg" : "pos"}">${ch > 0 ? "+" : ""}${ch.toFixed(1)}%</div>` : ""}${unsourced ? `<div class="chg neg">unsourced</div>` : ""}</td>`;
  }).join("")}</tr>`).join("")}</tbody></table></div><p class="muted small">Units: ${esc(uniq(fin.map(f => f.unit)).join(", ") || "—")}. Values flagged when the period-over-period change is at least the anomaly threshold. ${fin.some(f => f.data_status === "demo_fictional") ? pill("Fictional demo values", "warn") : ""}</p>` : `<div class="empty-state">No financial observations for this company. Add values taken from filed statements and link each to its evidence record. Never enter estimated figures.</div>`;
  const metric = metrics.includes(App.ui.metric) ? App.ui.metric : metrics[0];
  const chart = metric ? lineChart({ series: [{ name: metric, pts: periods.map(p => [dnum(p), valOf(metric, p)]).filter(p => p[1] !== null) }], xFmt: t => dfmt(t), dots: true, area: true, label: metric + " by period", yFmt: v => v.toLocaleString(undefined, { maximumFractionDigits: 1 }) }) : "";
  const ratios = ws.settings.ratios || [];
  const ratioTbl = ratios.length ? `<table class="mini"><thead><tr><th>Ratio</th>${periods.map(p => `<th class="num">${esc((fin.find(f => f.period_end === p) || {}).period_label || p)}</th>`).join("")}<th></th></tr></thead><tbody>${ratios.map((r, i) => `<tr><td>${esc(r.name)}<div class="muted small">${esc(r.num)} ÷ ${esc(r.den)}${Number(r.mult) !== 1 ? " × " + esc(r.mult) : ""}</div></td>${periods.map(p => { const a = valOf(r.num, p), b = valOf(r.den, p); return `<td class="num">${a !== null && b ? (a / b * (Number(r.mult) || 1)).toFixed(2) : `<span class="empty" title="Missing a component">—</span>`}</td>`; }).join("")}<td><button class="btn small" data-act="delRatio" data-i="${i}">Remove</button></td></tr>`).join("")}</tbody></table>` : `<p class="muted">No ratios defined.</p>`;
  const ratioForm = metrics.length >= 2 ? `<form class="row gap" data-sub="addRatio"><label class="flt"><span>Name</span><input id="r-name" required placeholder="e.g., DSO (days)"></label><label class="flt"><span>Numerator</span>${selectHtml("r-num", metrics, metrics[0])}</label><label class="flt"><span>Denominator</span>${selectHtml("r-den", metrics, metrics[1])}</label><label class="flt"><span>Multiplier</span><input id="r-mult" type="number" step="any" value="1"></label><button class="btn" type="submit">Add ratio</button></form>` : "";
  /* market */
  const mk = ws.mkt_obs.filter(m => m.company_id === c).sort((a, b) => cmp(a.date, b.date));
  const rets = mk.map((m, i) => { const p = i ? mk[i - 1] : null; const r = p && num(p.close) && num(m.close) !== null ? num(m.close) / num(p.close) - 1 : null; const b = p && num(p.benchmark_close) && num(m.benchmark_close) !== null ? num(m.benchmark_close) / num(p.benchmark_close) - 1 : null; return Object.assign({}, m, { _r: r, _b: b, _a: r !== null && b !== null ? r - b : null }); });
  const evts = ws.events.filter(e => e.company_id === c);

  else {

    const markers = evts.filter(e => has(e.date)).map(e => ({ x: dnum(e.date), label: e.date + " — " + e.title, cls: e.corrective_candidate ? "bad" : e.event_type === "insider_trade" ? "warn" : "" }));
    const ccs = evts.filter(e => e.corrective_candidate);

      if (idx < 0 || idx >= rets.length) return `<tr><td>${chip("events", e.id)}</td><td colspan="5">${pill("No trading data on or after this date", "mute")}</td></tr>`;

    ["AI-use policy reviewed (provided or confirmed unspecified)", a.ai_restrictions && a.ai_restrictions.status !== "pending"],
    ["Thesis recorded", has(s.thesis)], ["Perspective selected", s.perspective && s.perspective !== "Undecided"],
    ["All outline sections final", ws.sections.length > 0 && ws.sections.every(x => x.status === "final")],
    ["Page budget within limit", lim ? ws.sections.reduce((t, x) => t + (Number(x.target_pages) || 0), 0) <= lim : null],
    ["Every cited authority verified", unverifiedCites === 0],

}

/* ================= event wiring ================= */
function parseCompanyLines(text) {
  const existing = new Set(W().companies.map(c => String(raw(c.name) || "").toLowerCase().trim()));
  const seen = new Set();
  return String(text || "").split(/\r?\n/).map(l => l.replace(/^\s*(\d+[.)]|[-*•])\s*/, "").trim()).filter(Boolean).map(l => { const [name, ticker] = l.split("|").map(x => (x || "").trim()); const key = name.toLowerCase(); const dup = existing.has(key) || seen.has(key); seen.add(key); return { name, ticker: ticker || "", dup }; });
}
function createCompanies(list) {
  const add = list.filter(p => !p.dup && p.name);
  mutate(["companies"], ws => add.forEach(p => ws.companies.push({ id: uniqueId(ws, "companies"), name: p.name, ticker: p.ticker, cik: "", entity_type: "Unknown", reporting_status: "Unknown", industry: "", securities_activities: "", us_nexus: "", perspective_fit: "Unknown", summary: "", source_note: "Imported from professor's list " + todayIso(), scores: {} })));
  return add.length;
}
